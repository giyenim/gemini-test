<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이지스 AI 활용 능력 모의고사</title>
    <meta
      name="description"
      content="20문항 50점의 제미나이 활용 능력 모의고사. 채점이 끝나면 성적통지표가 나옵니다."
    />

    <!--
      공유 미리보기 (Open Graph) — 카카오톡·스레드·X 가 링크를 펼칠 때 읽는 값이다.
      **URL 은 반드시 절대 주소**여야 한다. 상대 경로(`/og.png`)를 적으면 크롤러가
      제 도메인에서 찾다가 그림 없이 뜬다.

      `og.png` 는 **표지를 그대로 잘라낸 것**이다 (다시 굽는 법은 README 의 "공유 미리보기" 절).
      **그림을 갈아 끼우면 `?v=` 를 올린다** — 카카오·메타는 URL 단위로 캐시해서
      같은 주소로 덮으면 옛 그림이 한참 남는다. 카카오는 디버거로 캐시를 지울 수도 있다.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="이지스 AI 활용 능력 모의고사" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://gemini-test.easyspub.co.kr/" />
    <meta property="og:title" content="2026학년도 이지스 AI 활용 능력 모의고사 — 제미나이 영역" />
    <meta
      property="og:description"
      content="20문항 · 50점. 채점이 끝나면 성적통지표가 나옵니다. 당신의 제미나이 활용 능력은 몇 등급입니까."
    />
    <meta property="og:image" content="https://gemini-test.easyspub.co.kr/og.png?v=1" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="시험지 표지 — 제 1 교시, 2026학년도 이지스 AI 활용 능력 모의고사, 제미나이 영역"
    />

    <!-- X(트위터)는 og 를 상당 부분 물려받지만, 큰 그림으로 펼치려면 card 지정이 필요하다 -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="2026학년도 이지스 AI 활용 능력 모의고사 — 제미나이 영역" />
    <meta
      name="twitter:description"
      content="20문항 · 50점. 채점이 끝나면 성적통지표가 나옵니다. 당신의 제미나이 활용 능력은 몇 등급입니까."
    />
    <meta name="twitter:image" content="https://gemini-test.easyspub.co.kr/og.png?v=1" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
