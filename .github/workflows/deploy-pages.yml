name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 진행 중이면 끝날 때까지 기다린다 — 중간에 끊으면 사이트가 반쯤 올라간 상태로 남는다
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exam-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: exam-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # 빌드 결과를 저장소에 커밋하지 않고 Pages 아티팩트로 올린다.
      # 매 배포가 dist 전체로 교체되므로 옛 해시 파일이 쌓이지 않는다.
      # path 는 액션 입력이라 위의 working-directory 가 적용되지 않는다 — 저장소 루트 기준.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: exam-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
